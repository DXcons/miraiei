<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>村上農園 - スタート</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Meiryo', sans-serif;
      background: linear-gradient(160deg, #e8f5e9 0%, #f1f8e9 100%);
      min-height: 100vh;
      padding: 28px 16px 40px;
      color: #222;
    }

    .wrap { max-width: 440px; margin: 0 auto; }

    .brand {
      text-align: center;
      margin-bottom: 26px;
    }

    .brand-icon { font-size: 48px; line-height: 1; margin-bottom: 8px; }

    .brand h1 {
      font-size: 22px;
      font-weight: 800;
      color: #2e5c28;
      letter-spacing: 0.04em;
    }

    .step-title {
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      color: #2e5c28;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .lang-list { display: flex; flex-direction: column; gap: 14px; }

    .lang-big {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      background: #fff;
      border: 2.5px solid #dde8dd;
      border-radius: 18px;
      padding: 20px 22px;
      font-size: 22px;
      font-weight: 800;
      color: #1a3d17;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 80, 0, 0.08);
      text-align: left;
    }

    .lang-big:active { transform: scale(0.98); border-color: #4caf50; }

    .lang-flag { font-size: 38px; line-height: 1; }

    .lang-sub { display: block; font-size: 13px; font-weight: 600; color: #7a9c76; margin-top: 2px; }

    .message {
      background: #fff;
      border-radius: 16px;
      padding: 26px 20px;
      text-align: center;
      font-size: 16px;
      line-height: 1.7;
      color: #c0392b;
      box-shadow: 0 4px 16px rgba(0, 80, 0, 0.08);
      margin-top: 18px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <div class="brand-icon">🌿</div>
    <h1>村上農園</h1>
  </div>

  <div class="step-title">ことばを えらんでください<br>Pilih bahasa<br>សូមជ្រើសរើសភាសា</div>
  <div class="lang-list">
    <button type="button" class="lang-big" onclick="chooseLang('ja')">
      <span class="lang-flag">🇯🇵</span><span>日本語<span class="lang-sub">にほんご</span></span>
    </button>
    <button type="button" class="lang-big" onclick="chooseLang('id')">
      <span class="lang-flag">🇮🇩</span><span>Bahasa Indonesia<span class="lang-sub">インドネシア語</span></span>
    </button>
    <button type="button" class="lang-big" onclick="chooseLang('km')">
      <span class="lang-flag">🇰🇭</span><span>ភាសាខ្មែរ<span class="lang-sub">カンボジア語</span></span>
    </button>
  </div>

  <div class="message hidden" id="invalidKeyMessage">
    このQRコードは 使（つか）えません。管理者（かんりしゃ）に 聞（き）いてください。<br>
    Kode QR ini tidak dapat digunakan. Silakan tanya admin.<br>
    កូដ QR នេះមិនអាចប្រើបានទេ។ សូមសួរអ្នកគ្រប់គ្រង។
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
  // 現場に貼ったQRコード（start.html?k=合言葉）の入口。
  // ここでは言語だけ選び、メニュー（staff.html）へ進む。名前は、メニューのカードを押したときに選ぶ。
  // URLに合言葉が無い場合（ホーム画面のショートカット等）は前回の合言葉を使う
  const urlKey = new URLSearchParams(window.location.search).get('k');
  if (urlKey) localStorage.setItem('staffQrKey', urlKey);
  const qrKey = urlKey || localStorage.getItem('staffQrKey');

  async function chooseLang(lang) {
    localStorage.setItem('staffLang', lang);

    // このスマホでログイン済みなら、そのアカウントの画面へ
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      const profile = await getMyProfile();
      if (profile) {
        window.location.href = roleHomePage(profile.role);
        return;
      }
    }

    if (!qrKey) {
      document.getElementById('invalidKeyMessage').classList.remove('hidden');
      return;
    }
    window.location.href = 'staff.html';
  }
</script>
</body>
</html>
