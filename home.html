<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホーム | 未来栄 図面管理システム</title>
<link rel="stylesheet" href="css/style.css?v=20261011a">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo-mark">未</div>
    <div>
      未来栄株式会社
      <small>図面管理システム</small>
    </div>
  </div>
  <nav>
    <div class="user-chip">
      <span id="userNameLabel">ゲスト</span>
      <a href="#" onclick="logout(); return false;">ログアウト</a>
    </div>
  </nav>
</header>

<main class="page">
  <h1 class="page-title">何をしますか？</h1>
  <p class="page-sub">行いたい作業を選択してください。</p>

  <div class="choice-grid cols-3">
    <div class="choice-card" onclick="location.href='case-new.html'">
      <div class="choice-icon">🗂️</div>
      <h2>案件を登録する・<br>書類を追加する</h2>
      <p>客先と品番を選んで、注文書・見積書・図面の追加や、単価の入力をします。進行中の案件も、納品済みの案件もここから。</p>
    </div>
    <div class="choice-card" onclick="location.href='search-customer.html'">
      <div class="choice-icon">🔍</div>
      <h2>案件・図面をさがす</h2>
      <p>客先・品番から、受注単価と外注単価を突き合わせた表と図面を見ます。</p>
    </div>
    <div class="choice-card" onclick="location.href='orders.html'">
      <div class="choice-icon">📋</div>
      <h2>受発注・請求書の管理</h2>
      <p>案件ごとの納期・ステータス・請求を一覧で管理します。</p>
    </div>
  </div>

  <p class="home-sub-link">
    <a href="pdf-new.html" class="text-link">案件に関係なく、図面のPDFだけを保存する ›</a>
  </p>
</main>

<footer class="mock-footer">未来栄株式会社 図面管理システム — © 2026</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script>
  initPage();
</script>

</body>
</html>
