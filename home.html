<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホーム | 未来栄 図面管理システム</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo-mark">未</div>
    <div>
      未来栄株式会社
      <small>図面管理システム</small>
    </div>
  </div>
  <nav>
    <div class="user-chip">
      <span id="userNameLabel">ゲスト</span>
      <a href="#" onclick="logout(); return false;">ログアウト</a>
    </div>
  </nav>
</header>

<main class="page">
  <h1 class="page-title">何をしますか？</h1>
  <p class="page-sub">図面の検索、新しい図面の作成、PDF図面の保存から選択してください。</p>

  <div class="choice-grid cols-3">
    <div class="choice-card" onclick="location.href='search.html'">
      <div class="choice-icon">🔍</div>
      <h2>過去の図面をさがす</h2>
      <p>条件を指定して、これまでに作成した図面を検索します。</p>
    </div>
    <div class="choice-card" onclick="location.href='new.html'">
      <div class="choice-icon">📄</div>
      <h2>新しい図面をつくる</h2>
      <p>ゼロから作成するか、過去の図面をコピーして編集します。</p>
    </div>
    <div class="choice-card" onclick="location.href='pdf-new.html'">
      <div class="choice-icon">🗄️</div>
      <h2>図面を保存する</h2>
      <p>PDFの図面を、客先・図面作成日・品名とあわせて登録します。</p>
    </div>
  </div>

  <p class="home-sub-link">
    <a href="pdf-list.html" class="text-link">保存済みのPDF図面を一覧で見る ›</a>
  </p>
</main>

<footer class="mock-footer">未来栄株式会社 図面管理システム — © 2026</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script>
  initPage();
</script>

</body>
</html>
