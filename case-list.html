<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品番の一覧 | 未来栄 図面管理システム</title>
<link rel="stylesheet" href="css/style.css?v=20261011b">
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="logo-mark">未</div>
    <div>
      未来栄株式会社
      <small>図面管理システム</small>
    </div>
  </div>
  <nav>
    <div class="user-chip">
      <span id="userNameLabel">ゲスト</span>
      <a href="#" onclick="logout(); return false;">ログアウト</a>
    </div>
  </nav>
</header>

<main class="page page-wide case-page">
  <div class="breadcrumb">
    <a href="home.html">ホーム</a> ＞ <a href="search-customer.html">過去の案件を管理する</a> ＞ <span id="crumbCustomer"></span>
  </div>
  <div class="page-toolbar">
    <a href="case-new.html" class="btn btn-ghost btn-sm">＋ 過去の案件を登録する</a>
    <a href="case-import.html" id="importLink" class="btn btn-ghost btn-sm">📥 まとめて取り込む</a>
  </div>
  <h1 class="page-title" id="pageTitle">品番の一覧</h1>
  <p class="page-sub">行を選ぶと案件のページが開きます（書類・納期・ステータスと、受注単価と外注単価の突き合わせ表）。</p>

  <div class="card">
    <div class="field" style="margin-bottom:0;">
      <label for="keyword" class="search-label"><span id="keywordLabel">検索する：品番・品名・図面番号でしぼり込む</span>
        <small>（SHAFTは「シャフト」でもヒットします）</small></label>
      <input type="text" id="keyword" placeholder="例：CAM-1581 / スタンド / シャフト / 10202">
    </div>
    <label class="check-label" style="margin-top:12px;"><input type="checkbox" id="showActive"> 進行中の案件も表示する</label>
  </div>
  </div>

  <div id="resultArea"><div class="card empty-state">読み込み中…</div></div>
</main>

<footer class="mock-footer">未来栄株式会社 図面管理システム — © 2026</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js?v=20261011b"></script>
<script src="js/common.js?v=20261011b"></script>
<script src="js/pdf-store.js?v=20261011b"></script>
<script src="js/case-store.js?v=20261011b"></script>
<script src="js/order-store.js?v=20261011b"></script>
<script>
  const params = new URLSearchParams(location.search);
  const groupKey = params.get("customer") || CASE_CUSTOMER_GROUPS[0].key;
  let CASES = [];

  document.getElementById("crumbCustomer").textContent = groupKey;
  document.getElementById("importLink").href = `case-import.html?customer=${encodeURIComponent(groupKey)}`;

  // 表の行がまだ無い案件(品番を登録した進行中の取引)も一覧に入れる
  function mergeOrders(cases, orders) {
    const byCode = new Map(cases.map((c) => [c.code, c]));
    orders.filter((o) => o.caseCode && customerGroupOf(o.customer) === groupKey).forEach((o) => {
      const code = String(o.caseCode).trim();
      if (byCode.has(code)) {
        byCode.get(code).order = o;
      } else {
        const c = summarizeCaseRows(code, []);
        c.order = o;
        byCode.set(code, c);
        cases.push(c);
      }
    });
    return cases;
  }
  document.title = `${groupKey} の一覧 | 未来栄 図面管理システム`;

  const codeLabel = caseCodeLabel(groupKey);
  document.getElementById("pageTitle").textContent = `${groupKey} の過去の案件（${codeLabel}の一覧）`;

  // 進行中 = 取引があり、入金済み・受注せずになっていない案件
  const isActiveCase = (c) => !!c.order && !isOrderClosed(c.order.status);
  document.getElementById("keywordLabel").textContent = `検索する：${codeLabel}・品名・図面番号でしぼり込む`;

  // 英語の品名(SHAFT)もカタカナ(シャフト)で探せる。図面番号のハイフンの有無も問わない
  function matchKeyword(row, kw) {
    return matchesSearch([row.productCode, row.productName, row.drawingNo, "MN-" + row.drawingNo, row.outsourcer], kw);
  }

  function render() {
    const area = document.getElementById("resultArea");
    const kw = document.getElementById("keyword").value.trim();

    if (CASES.length === 0) {
      // 取り込み前の客先は、これまでの「保存したPDF図面」の検索へ案内する
      const pdfLink = groupKey === CASE_OTHER_GROUP
        ? "pdf-list.html"
        : `pdf-list.html?customer=${encodeURIComponent(groupKey)}`;
      area.innerHTML = `
        <div class="card empty-state">
          <div class="empty-icon">🗂️</div>
          ${escapeHtml(groupKey)} の案件はまだありません。
          <div style="margin-top:14px;"><a href="case-new.html" class="text-link">過去の案件を登録する ›</a></div>
          <div style="margin-top:8px;"><a href="${pdfLink}" class="text-link">保存したPDF図面から探す ›</a></div>
        </div>`;
      return;
    }

    const showActive = document.getElementById("showActive").checked;
    const hits = CASES
      .filter((c) => showActive || !isActiveCase(c))
      .map((c) => ({ c, matched: kw ? c.rows.filter((r) => matchKeyword(r, kw)) : [] }))
      .filter(({ c, matched }) => !kw || matched.length > 0 ||
        matchesSearch([c.code, c.order && c.order.productName], kw));

    if (hits.length === 0) {
      const hidden = CASES.filter(isActiveCase).length;
      area.innerHTML = `<div class="card empty-state"><div class="empty-icon">🔍</div>該当する過去の案件がありません。
        ${hidden && !showActive ? `<br>（進行中の案件が${hidden}件あります。上の「進行中の案件も表示する」で表示できます）` : ""}</div>`;
      return;
    }

    area.innerHTML = `
      <div class="card">
        <div class="table-wrap">
          <table class="data-table case-table">
            <thead>
              <tr>
                <th>${escapeHtml(codeLabel)}</th>
                <th>ステータス</th>
                <th>品名</th>
                <th class="num">点数</th>
                <th>受注年月日</th>
                <th>外注先</th>
                <th class="num">受注金額</th>
                <th class="num">外注金額</th>
                <th class="num">粗利率</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              ${hits.map(({ c, matched }) => {
                const rate = marginRate(c.orderTotal, c.outsourceTotal);
                const dates = c.firstOrderDate === c.lastOrderDate
                  ? formatCaseDate(c.firstOrderDate)
                  : `${formatCaseDate(c.firstOrderDate)}〜${formatCaseDate(c.lastOrderDate)}`;
                const names = (matched.length ? matched : c.rows).map((r) => r.productName);
                const first = names[0] || "";
                const label = names.length > 1 ? `${first} ほか${names.length - 1}点`
                  : first || (c.order && c.order.productName) || "（表はまだありません）";
                const href = caseDetailUrl(groupKey, c.code) + (kw && matched.length ? `&q=${encodeURIComponent(kw)}` : "");
                const st = c.order ? orderStatusInfo(c.order.status) : null;
                return `
                  <tr class="case-row" data-href="${escapeHtml(href)}">
                    <td class="case-code"><a href="${escapeHtml(href)}">${escapeHtml(c.code)}</a></td>
                    <td>${st ? `<span class="status-pill ${st.cls}">${escapeHtml(c.order.status)}</span>` : `<span class="text-muted">—</span>`}</td>
                    <td class="case-names">${matched.length ? "一致：" : ""}${escapeHtml(label)}</td>
                    <td class="num">${c.count}</td>
                    <td>${escapeHtml(dates)}</td>
                    <td>${escapeHtml(c.outsourcers.join("、") || "-")}</td>
                    <td class="num">${formatYen(c.orderTotal)}</td>
                    <td class="num">${formatYen(c.outsourceTotal)}</td>
                    <td class="num">${rate === null ? "-" : rate.toFixed(1) + "%"}</td>
                    <td>${c.needsCheckCount ? `<span class="badge badge-check">要確認 ${c.needsCheckCount}</span>` : ""}</td>
                  </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>`;

    area.querySelectorAll("tr[data-href]").forEach((tr) => {
      tr.addEventListener("click", () => (location.href = tr.dataset.href));
    });
  }

  document.getElementById("keyword").addEventListener("input", render);
  document.getElementById("showActive").addEventListener("change", render);

  (async () => {
    const ok = await initPage();
    if (!ok) return;
    try {
      CASES = groupCaseItemsByCode(await fetchCaseItemsByGroup(groupKey));
      try {
        mergeOrders(CASES, await fetchOrders());
      } catch (err) {
        console.warn("取引を取得できませんでした", err);
      }
      render();
    } catch (err) {
      console.error("案件データの取得に失敗しました", err);
      document.getElementById("resultArea").innerHTML = `
        <div class="card empty-state">
          <div class="empty-icon">⚠️</div>
          データを読み込めませんでした。<br>
          Firestoreのセキュリティルールに <code>caseItems</code> の設定が入っているか確認してください。
        </div>`;
    }
  })();
</script>

</body>
</html>
