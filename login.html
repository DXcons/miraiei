<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | 未来栄 図面管理システム(モック)</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">未</div>
    <h1>未来栄株式会社</h1>
    <p class="system-name">図面管理システム(モック)</p>

    <div class="login-error" id="loginError">IDとパスワードを入力してください。</div>

    <form id="loginForm" onsubmit="return handleLogin(event)">
      <div class="field">
        <label for="loginId">メールアドレス</label>
        <input type="email" id="loginId" placeholder="例）y-tanaka@miraiei.co.jp" autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPass">パスワード</label>
        <input type="password" id="loginPass" placeholder="パスワードを入力" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">ログイン</button>
    </form>

    <p class="login-hint">※ アカウントは管理者が発行します。お持ちでない場合は管理者にお問い合わせください。</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/common.js"></script>
<script>
  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById("loginId").value.trim();
    const pass = document.getElementById("loginPass").value.trim();
    const errorBox = document.getElementById("loginError");

    const { ok } = await loginWithPassword(email, pass);
    if (ok) {
      window.location.href = "home.html";
    } else {
      errorBox.textContent = "メールアドレスまたはパスワードが正しくありません。";
      errorBox.style.display = "block";
    }
    return false;
  }
</script>

</body>
</html>
